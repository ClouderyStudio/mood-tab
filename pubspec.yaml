name: mood_tab
description: "mood-tab 是一款专注于治愈与陪伴的跨平台个人情绪记录软件。本地数据库存储，100% 不上传云端。"
publish_to: 'none'
version: 2.7.19+24

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.2

  # 本地数据库
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # 图表
  fl_chart: ^0.69.2

  # 本地通知（提醒功能）
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # 生物识别（隐私锁）
  local_auth: ^2.3.0

  # 本地存储（偏好设置）
  shared_preferences: ^2.3.3

  # PDF 导出
  pdf: ^3.11.2
  printing: ^5.14.2

  # 文件分享
  share_plus: ^10.1.4

  # UI 增强
  cupertino_icons: ^1.0.8

  # WebView（心理测评套壳）
  webview_flutter: ^4.10.0

  # 拨打电话（危机支持热线）
  url_launcher: ^6.3.1

  # 读取版本号
  package_info_plus: ^8.1.2

  # 字体
  google_fonts: ^6.2.1

  # HTTP 请求
  http: ^1.2.1

  # 图片选择（情绪安全记录附图，仅本地存储）
  image_picker: ^1.1.2

  # 权限管理
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/about.html
